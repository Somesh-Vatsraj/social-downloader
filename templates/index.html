<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarathi DL Fetcher — Manual Captcha</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Arial, sans-serif;
    background: #f0f4f8; margin: 0; padding: 20px;
    min-height: 100vh;
  }
  .card {
    max-width: 720px; margin: 0 auto; background: #fff;
    border-radius: 14px; padding: 26px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
  }
  h1 { margin: 0 0 6px; font-size: 21px; color: #1e3a8a; }
  p.sub { margin: 0 0 22px; color: #64748b; font-size: 13.5px; }

  label {
    display: block; font-size: 12.5px; font-weight: 600;
    color: #334155; margin: 14px 0 5px;
  }
  input {
    width: 100%; padding: 10px 12px;
    border: 1.5px solid #cbd5e1; border-radius: 8px;
    font-size: 14px; transition: border .15s;
  }
  input:focus { outline: none; border-color: #2563eb; }

  button {
    width: 100%; margin-top: 20px; padding: 13px;
    background: #2563eb; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #1d4ed8; }

  button.secondary { background: #64748b; margin-top: 10px; }
  button.secondary:hover:not(:disabled) { background: #475569; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .step {
    display: none;
    animation: fadeIn .25s ease-in;
  }
  .step.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .captcha-box {
    display: flex; align-items: center; gap: 14px;
    margin: 16px 0; padding: 14px;
    background: #f8fafc; border: 1.5px dashed #cbd5e1;
    border-radius: 10px;
  }
  .captcha-box img {
    height: 50px; border-radius: 6px;
    background: #fff; padding: 4px;
    border: 1px solid #e2e8f0;
    image-rendering: crisp-edges;
  }
  .captcha-box input {
    flex: 1; font-size: 20px; letter-spacing: 4px;
    text-align: center; font-family: 'Courier New', monospace;
    text-transform: lowercase;
  }

  .alert {
    padding: 12px 14px; border-radius: 8px;
    font-size: 13.5px; margin-top: 16px;
    display: none;
  }
  .alert.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
  .alert.info  { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; display: block; }
  .alert.ok    { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }

  .result-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-top: 16px;
  }
  .result-grid .item {
    padding: 10px 12px; background: #f8fafc;
    border-radius: 8px; border: 1px solid #e2e8f0;
    font-size: 13px;
  }
  .result-grid .item.full { grid-column: 1 / -1; }
  .result-grid .k { color: #64748b; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; }
  .result-grid .v { color: #0f172a; font-weight: 600; margin-top: 3px; word-break: break-word; }

  .imgs { display: flex; gap: 14px; margin-top: 16px; }
  .imgs img {
    max-height: 110px; border-radius: 6px;
    background: #f1f5f9; padding: 4px; border: 1px solid #e2e8f0;
  }

  .loader {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #fff; border-top-color: transparent;
    border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  details { margin-top: 16px; font-size: 12px; }
  details summary { cursor: pointer; color: #64748b; }
  details pre {
    background: #0f172a; color: #e2e8f0; padding: 12px;
    border-radius: 6px; overflow: auto; margin-top: 8px;
    max-height: 300px; font-size: 11.5px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>🚗 Sarathi DL Details Fetcher</h1>
  <p class="sub">कैप्चा खुद टाइप करें — कोई OCR नहीं, 100% भरोसेमंद</p>

  <!-- STEP 1: Form -->
  <div class="step active" id="step1">
    <label>Driving Licence Number</label>
    <input id="dlno" placeholder="MH0220100024875" value="MH0220100024875" autocomplete="off">

    <div class="row">
      <div>
        <label>Date of Birth (DD-MM-YYYY)</label>
        <input id="dob" placeholder="20-05-1982" value="20-05-1982" autocomplete="off">
      </div>
      <div>
        <label>State</label>
        <input id="state" value="Bihar" autocomplete="off">
      </div>
    </div>

    <div class="row">
      <div>
        <label>RTO Code (खाली छोड़ सकते हैं)</label>
        <input id="rto_code" placeholder="BR-01" autocomplete="off">
      </div>
      <div>
        <label>RTO Name (optional)</label>
        <input id="rto_name" placeholder="PHULWARI SHARIF, PATNA" autocomplete="off">
      </div>
    </div>

    <button id="btnGetCaptcha">Get Captcha →</button>
    <div class="alert" id="alert1"></div>
  </div>

  <!-- STEP 2: Captcha -->
  <div class="step" id="step2">
    <div class="alert info" id="alert2">
      नीचे कैप्चा image में जो अक्षर दिख रहे हैं, वही टाइप करें।
    </div>

    <div class="captcha-box">
      <img id="captchaImg" alt="captcha">
      <input id="captchaInput"
             placeholder="कैप्चा यहाँ"
             maxlength="10"
             autocomplete="off"
             autocapitalize="off"
             autocorrect="off"
             spellcheck="false">
    </div>

    <button id="btnSubmit">Submit →</button>
    <button id="btnBack" class="secondary">← वापस / नया कैप्चा</button>
    <div class="alert" id="alert2b"></div>
  </div>

  <!-- STEP 3: Result -->
  <div class="step" id="step3">
    <div class="alert ok" id="alert3">✅ DL details मिल गईं</div>
    <div class="result-grid" id="resultGrid"></div>
    <div class="imgs" id="imgs"></div>
    <button id="btnNew" class="secondary">नया DL खोजें</button>
  </div>

  <details id="debugDetails" style="display:none;">
    <summary>Debug output</summary>
    <pre id="debugPre"></pre>
  </details>
</div>

<script>
const $ = id => document.getElementById(id);
const step1 = $("step1"), step2 = $("step2"), step3 = $("step3");
const alert1 = $("alert1"), alert2b = $("alert2b");

let currentSid = null;
let currentFormData = null;

function show(step) {
  [step1, step2, step3].forEach(s => s.classList.remove("active"));
  step.classList.add("active");
}

function setAlert(el, msg, type) {
  el.className = "alert " + (type || "error");
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}

function setLoading(btn, on, text) {
  btn.disabled = on;
  if (on) {
    btn.dataset.oldText = btn.textContent;
    btn.innerHTML = '<span class="loader"></span>' + (text || "कृपया प्रतीक्षा करें...");
  } else {
    btn.textContent = btn.dataset.oldText || btn.textContent;
  }
}

// ---------- STEP 1: Get Captcha ----------
$("btnGetCaptcha").onclick = async () => {
  setAlert(alert1, "");
  const data = {
    dlno: $("dlno").value.trim(),
    dob: $("dob").value.trim(),
    state: $("state").value.trim(),
    rto_code: $("rto_code").value.trim(),
    rto_name: $("rto_name").value.trim(),
  };

  if (!data.dlno || !data.dob) {
    setAlert(alert1, "DL number और DOB दोनों भरें", "error");
    return;
  }

  setLoading($("btnGetCaptcha"), true, "कैप्चा ला रहे हैं...");

  try {
    const res = await fetch("/api/start", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(data),
    });
    const j = await res.json();

    if (!j.success) {
      setAlert(alert1, "❌ " + (j.error || "असफल"), "error");
      return;
    }

    currentSid = j.sid;
    currentFormData = data;
    $("captchaImg").src = "data:image/png;base64," + j.captcha;
    $("captchaInput").value = "";
    setAlert(alert2b, "");
    show(step2);
    $("captchaInput").focus();
  } catch (e) {
    setAlert(alert1, "❌ " + e.message, "error");
  } finally {
    setLoading($("btnGetCaptcha"), false);
  }
};

// ---------- STEP 2: Submit ----------
async function doSubmit() {
  const captcha = $("captchaInput").value.trim();
  if (!captcha) {
    setAlert(alert2b, "कैप्चा टाइप करें", "error");
    $("captchaInput").focus();
    return;
  }

  setAlert(alert2b, "");
  setLoading($("btnSubmit"), true, "जाँच कर रहे हैं...");

  try {
    const res = await fetch("/api/submit", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({sid: currentSid, captcha}),
    });
    const j = await res.json();

    if (!j.success) {
      const code = j.code || "";
      setAlert(alert2b, "❌ " + (j.error || "असफल"), "error");

      // कैप्चा गलत → user को नया captcha लेने दो
      if (code === "captcha_invalid" || code === "session_expired") {
        // session खत्म — वापस step1
        setTimeout(() => {
          setAlert(alert1, "कैप्चा गलत था — नया कैप्चा लें", "info");
          show(step1);
        }, 1200);
      }

      // debug info
      if (j.preview) {
        $("debugDetails").style.display = "block";
        $("debugPre").textContent = "preview: " + j.preview;
      }
      return;
    }

    // success
    renderResult(j);
    show(step3);
  } catch (e) {
    setAlert(alert2b, "❌ " + e.message, "error");
  } finally {
    setLoading($("btnSubmit"), false);
  }
}

$("btnSubmit").onclick = doSubmit;
$("captchaInput").addEventListener("keydown", e => {
  if (e.key === "Enter") doSubmit();
});

// ---------- Back ----------
$("btnBack").onclick = () => {
  currentSid = null;
  setAlert(alert2b, "");
  setAlert(alert1, "");
  show(step1);
};

// ---------- New ----------
$("btnNew").onclick = () => {
  currentSid = null;
  $("resultGrid").innerHTML = "";
  $("imgs").innerHTML = "";
  setAlert(alert1, "");
  show(step1);
};

// ---------- Render Result ----------
function renderResult(j) {
  const fields = [
    ["dlno", "DL Number"],
    ["name", "Name"],
    ["father_name", "S/W/D of"],
    ["dob", "Date of Birth"],
    ["blood_group", "Blood Group"],
    ["category", "Category"],
    ["class_of_vehicles", "Class of Vehicles"],
    ["validity", "Validity"],
    ["last_endorsed_state", "State"],
    ["last_endorsed_rto", "RTO"],
    ["present_address", "Present Address", true],
    ["badge_numbers", "Badge Numbers"],
  ];

  const grid = $("resultGrid");
  grid.innerHTML = "";
  for (const [key, label, full] of fields) {
    const v = j[key];
    if (!v) continue;
    const div = document.createElement("div");
    div.className = "item" + (full ? " full" : "");
    div.innerHTML = `<div class="k">${label}</div><div class="v">${escapeHtml(v)}</div>`;
    grid.appendChild(div);
  }

  const imgs = $("imgs");
  imgs.innerHTML = "";
  if (j.photo) {
    const i = document.createElement("img");
    i.src = j.photo;
    i.alt = "photo";
    imgs.appendChild(i);
  }
  if (j.signature) {
    const i = document.createElement("img");
    i.src = j.signature;
    i.alt = "signature";
    imgs.appendChild(i);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  }[c]));
}
</script>
</body>
</html>
