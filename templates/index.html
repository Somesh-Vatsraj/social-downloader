{% extends "base.html" %}

{% block title %}Search — ECI{% endblock %}

{% block content %}
<form id="search-form" class="card">
  <label for="epic">EPIC Number</label>
  <input
    type="text"
    id="epic"
    name="epic"
    placeholder="e.g. ABC1234567"
    autocomplete="off"
    required
    maxlength="20"
  />

  <label for="attempts">Max captcha attempts</label>
  <select id="attempts" name="attempts">
    <option value="3">3</option>
    <option value="5" selected>5</option>
    <option value="10">10</option>
  </select>

  <button type="submit" id="submit-btn">
    <span class="btn-text">Search</span>
    <span class="spinner" hidden></span>
  </button>
</form>

<div id="status" class="status" hidden></div>

<div id="result-box" class="card result" hidden></div>

<script>
const form = document.getElementById("search-form");
const btn = document.getElementById("submit-btn");
const statusEl = document.getElementById("status");
const resultBox = document.getElementById("result-box");

function setLoading(on) {
  btn.disabled = on;
  btn.querySelector(".btn-text").hidden = on;
  btn.querySelector(".spinner").hidden = !on;
  if (on) {
    statusEl.hidden = false;
    statusEl.textContent = "Fetching captcha, solving OCR, encrypting… (can take 20–40s)";
    resultBox.hidden = true;
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const epic = document.getElementById("epic").value.trim();
  const attempts = parseInt(document.getElementById("attempts").value, 10);
  if (!epic) return;

  setLoading(true);

  try {
    const res = await fetch("/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ epic, attempts })
    });
    const data = await res.json();

    statusEl.hidden = true;
    resultBox.hidden = false;

    if (!res.ok) {
      resultBox.innerHTML =
        '<h2 class="error">Error</h2><pre>' +
        JSON.stringify(data, null, 2) +
        "</pre>";
      return;
    }

    const r = data.result || {};
    const captcha = data.captcha_text || "-";
    const used = data.attempts || "-";

    resultBox.innerHTML = `
      <h2>Result for <code>${epic}</code></h2>
      <p class="meta">
        Captcha OCR: <b>${captcha}</b> &nbsp;|&nbsp; Attempts used: <b>${used}</b>
      </p>
      <pre>${JSON.stringify(r, null, 2)}</pre>
    `;
  } catch (err) {
    statusEl.hidden = true;
    resultBox.hidden = false;
    resultBox.innerHTML = '<h2 class="error">Network error</h2><pre>' + err + "</pre>";
  } finally {
    setLoading(false);
  }
});
</script>
{% endblock %}
