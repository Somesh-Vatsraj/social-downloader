<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🎙️ Voice Cloning</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 760px; margin: 0 auto; padding: 24px;
    background: #0f172a; color: #e2e8f0;
  }
  h1 { color: #38bdf8; margin-bottom: 4px; }
  .sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
  label { display: block; margin-top: 18px; font-weight: 600; font-size: 14px; }
  textarea, select, input[type=file] {
    width: 100%; padding: 11px; margin-top: 6px;
    border-radius: 10px; border: 1px solid #334155;
    background: #1e293b; color: #e2e8f0; font-size: 15px;
    font-family: inherit;
  }
  textarea { min-height: 110px; resize: vertical; }
  button {
    margin-top: 12px; padding: 12px 22px; border: none;
    border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 15px;
  }
  #recBtn { background: #ef4444; color: #fff; }
  #recBtn.recording { background: #7f1d1d; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .6; } }
  #goBtn { background: #38bdf8; color: #0f172a; width: 100%; padding: 14px; font-size: 16px; }
  #goBtn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
  audio { width: 100%; margin-top: 14px; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .status {
    margin-top: 16px; padding: 12px; border-radius: 10px;
    background: #1e293b; font-size: 14px; min-height: 20px;
  }
  .status.err { background: #7f1d1d; }
  .status.ok  { background: #14532d; }
  .hint { font-size: 12px; color: #64748b; margin-top: 4px; }
</style>
</head>
<body>

<h1>🎙️ Voice Cloning Website</h1>
<p class="sub">अपनी आवाज़ क्लोन करें — रिकॉर्ड करें या फाइल अपलोड करें।</p>

<label>टेक्स्ट (जो बोलवाना है)</label>
<textarea id="text" placeholder="नमस्ते, यह मेरी क्लोन की गई आवाज़ है।"></textarea>

<label>भाषा</label>
<select id="lang">
  <option value="hi">हिंदी</option>
  <option value="en">English</option>
  <option value="es">Spanish</option>
  <option value="fr">French</option>
  <option value="de">German</option>
  <option value="ar">Arabic</option>
  <option value="zh-cn">Chinese</option>
  <option value="ja">Japanese</option>
  <option value="ru">Russian</option>
</select>

<label>🎤 अपनी आवाज़ रिकॉर्ड करें (6+ सेकंड)</label>
<div class="row">
  <button id="recBtn" type="button">● रिकॉर्ड शुरू</button>
  <span id="recStatus" class="hint">माइक बंद</span>
</div>
<audio id="preview" controls style="display:none;"></audio>

<label>या ऑडियो फाइल अपलोड करें (.wav, .mp3, .webm, .m4a)</label>
<input type="file" id="file" accept="audio/*" />
<p class="hint">अगर दोनों दिए हैं, तो अपलोड की गई फाइल प्राथमिकता लेगी।</p>

<button id="goBtn" type="button">🎤 वॉइस क्लोन करें</button>
<div class="status" id="status">तैयार।</div>
<audio id="result" controls style="display:none;"></audio>

<script>
const $ = id => document.getElementById(id);
let mediaRecorder = null, chunks = [], recordedBlob = null;

// ---- Mic Recording ----
$('recBtn').onclick = async () => {
  const btn = $('recBtn'), st = $('recStatus');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    chunks = [];
    mediaRecorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(chunks, { type: 'audio/webm' });
      const p = $('preview');
      p.src = URL.createObjectURL(recordedBlob);
      p.style.display = 'block';
      btn.textContent = '● रिकॉर्ड शुरू';
      btn.classList.remove('recording');
      st.textContent = '✅ रिकॉर्ड हो गया — नीचे सुनें';
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();
    btn.textContent = '⏹ रिकॉर्ड बंद';
    btn.classList.add('recording');
    st.textContent = '🔴 रिकॉर्डिंग...';
  } catch (e) {
    st.textContent = '❌ माइक एक्सेस नहीं मिला: ' + e.message;
  }
};

// ---- Clone ----
$('goBtn').onclick = async () => {
  const text = $('text').value.trim();
  const lang = $('lang').value;
  const file = $('file').files[0];
  const st = $('status'), btn = $('goBtn');

  st.className = 'status';
  if (!text) { st.textContent = '❌ टेक्स्ट लिखें।'; st.classList.add('err'); return; }

  const audioBlob = file || recordedBlob;
  if (!audioBlob) {
    st.textContent = '❌ पहले अपनी आवाज़ रिकॉर्ड करें या फाइल अपलोड करें।';
    st.classList.add('err'); return;
  }

  const fd = new FormData();
  fd.append('text', text);
  fd.append('language', lang);
  fd.append('ref_audio', audioBlob, 'ref.wav');

  btn.disabled = true;
  st.textContent = '⏳ प्रोसेस हो रहा है... पहली बार 40-90 सेकंड लग सकते हैं।';

  try {
    const res = await fetch('/clone', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok || data.error) {
      st.textContent = '❌ ' + (data.error || 'Unknown error');
      st.classList.add('err');
      return;
    }
    const r = $('result');
    r.src = data.audio_url + '?t=' + Date.now();
    r.style.display = 'block';
    r.play();
    st.textContent = '✅ हो गया! नीचे सुनें।';
    st.classList.add('ok');
  } catch (e) {
    st.textContent = '❌ Network error: ' + e.message;
    st.classList.add('err');
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
