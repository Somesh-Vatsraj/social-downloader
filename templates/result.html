{% extends "base.html" %}

{% block title %}Result — ECI{% endblock %}

{% block content %}
<div class="card">
  <h2>Result for <code>{{ epic }}</code></h2>
  <p class="meta">
    Captcha OCR: <b>{{ captcha_text }}</b> &nbsp;|&nbsp; Attempts: <b>{{ attempts }}</b>
  </p>
  <pre>{{ result | tojson(indent=2) }}</pre>
  <a class="back" href="/">← New search</a>
</div>
{% endblock %}
