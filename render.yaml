services:
  - type: web
    name: eci-search
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_SECRET
        generateValue: true
      - key: ECI_AES_KEY_B64
        sync: false
      - key: ECI_PUBLIC_KEY_B64
        sync: false
