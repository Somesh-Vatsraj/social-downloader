version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - YTDLP_POT_PROVIDER=http://bgutil-provider:4416
    depends_on:
      - bgutil-provider

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    init: true
    restart: unless-stopped
